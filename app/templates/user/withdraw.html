{% extends "layout.html" %}
{% block title %}Withdraw{% endblock %}
{% block page_title %}Withdraw Funds{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="db-card transaction-card">
      <div class="txn-card-icon withdraw-icon">
        <i class="bi bi-arrow-up-circle-fill"></i>
      </div>
      <h2 class="txn-card-title">Withdraw Funds</h2>
      <p class="txn-card-subtitle">Withdraw cash from your account</p>

      <div class="balance-display">
        <span class="balance-display-label">Available Balance</span>
        <span class="balance-display-amount">${{ "%.2f"|format(account.balance) }}</span>
      </div>

      <form method="POST">
        <div class="form-group">
          <label class="form-label">Amount</label>
          <div class="input-icon-wrap">
            <span class="input-icon currency-symbol">$</span>
            <input type="number" name="amount" class="form-control input-with-icon"
                   placeholder="0.00" min="0.01" step="0.01"
                   max="{{ account.balance }}" required>
          </div>
        </div>

        <div class="quick-amounts">
          <button type="button" class="quick-amt" onclick="setAmount(50)">$50</button>
          <button type="button" class="quick-amt" onclick="setAmount(100)">$100</button>
          <button type="button" class="quick-amt" onclick="setAmount(500)">$500</button>
          <button type="button" class="quick-amt" onclick="setMax()">Max</button>
        </div>

        <div class="form-group">
          <label class="form-label">Description (optional)</label>
          <input type="text" name="description" class="form-control" placeholder="e.g. ATM withdrawal">
        </div>

        <button type="submit" class="btn-txn-withdraw w-100">
          <i class="bi bi-check-circle me-2"></i>Confirm Withdrawal
        </button>
      </form>
    </div>
  </div>
</div>
<script>
function setAmount(v) { document.querySelector('input[name="amount"]').value = v.toFixed(2); }
function setMax() { document.querySelector('input[name="amount"]').value = {{ account.balance }}; }
</script>
{% endblock %}
