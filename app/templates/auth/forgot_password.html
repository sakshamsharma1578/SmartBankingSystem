{% extends "base.html" %}
{% block title %}Forgot Password — SmartBank{% endblock %}
{% block body %}
<div class="auth-page auth-page-centered">
  <div class="auth-card" style="max-width:440px;width:100%">
    <a href="{{ url_for('auth.index') }}" class="auth-brand justify-content-center mb-4">
      <i class="bi bi-shield-lock-fill"></i><span>SmartBank</span>
    </a>
    <h1 class="auth-title">Reset Password</h1>
    <p class="auth-subtitle">Enter your email and we'll send a reset link</p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <i class="bi bi-envelope-fill input-icon"></i>
          <input type="email" name="email" class="form-control input-with-icon"
                 placeholder="you@example.com" required>
        </div>
      </div>
      <button type="submit" class="btn-auth-primary w-100">
        <i class="bi bi-send me-2"></i>Send Reset Link
      </button>
    </form>
    <p class="auth-footer-text mt-3"><a href="{{ url_for('auth.login') }}" class="auth-link">← Back to Sign In</a></p>
  </div>
</div>
{% endblock %}
