{% extends "base.html" %}
{% block title %}Set New Password — SmartBank{% endblock %}
{% block body %}
<div class="auth-page auth-page-centered">
  <div class="auth-card" style="max-width:440px;width:100%">
    <a href="{{ url_for('auth.index') }}" class="auth-brand justify-content-center mb-4">
      <i class="bi bi-shield-lock-fill"></i><span>SmartBank</span>
    </a>
    <h1 class="auth-title">New Password</h1>
    <p class="auth-subtitle">Enter your new password below</p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock-fill input-icon"></i>
          <input type="password" name="password" class="form-control input-with-icon"
                 placeholder="Min. 8 characters" required minlength="8">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock-fill input-icon"></i>
          <input type="password" name="confirm_password" class="form-control input-with-icon"
                 placeholder="Repeat password" required minlength="8">
        </div>
      </div>
      <button type="submit" class="btn-auth-primary w-100">
        <i class="bi bi-check-circle me-2"></i>Update Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
